name: Auto News Bot (Debug)

concurrency:
  group: auto-news-bot
  cancel-in-progress: false

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: Derrick-MUGISHA
      GIT_AUTHOR_EMAIL: 188050182+Derrick-MUGISHA@users.noreply.github.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Show directory before running script
        run: |
          echo "=== Current directory ==="
          pwd
          echo ""
          echo "=== Files in repo root ==="
          ls -la
          echo ""
          echo "=== Files in data/ (if exists) ==="
          ls -la data/ || echo "data/ directory doesn't exist yet"

      - name: Fetch and Update News
        run: npm start

      - name: Show directory after running script
        run: |
          echo "=== Files in repo root after script ==="
          ls -la
          echo ""
          echo "=== Files in data/ directory ==="
          ls -la data/ || echo "data/ directory still doesn't exist"
          echo ""
          echo "=== Check if README.md changed ==="
          git diff README.md || echo "README.md doesn't exist or no changes"
          echo ""
          echo "=== Check git status ==="
          git status

      - name: Commit and Push Changes
        run: |
          git config --global user.name "$GIT_AUTHOR_NAME"
          git config --global user.email "$GIT_AUTHOR_EMAIL"

          # Stage every generated file. The script writes README.md,
          # data/news_log.md, data/stats.json, data/categorized.json and
          # data/interview_questions.json; staging only some of them leaves
          # the rest unstaged, which makes the rebase below refuse to run.
          git add -A

          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "🤖 Auto news update: $(date -u +'%Y-%m-%d %H:%M UTC')" \
            -m "Co-authored-by: $GIT_AUTHOR_NAME <$GIT_AUTHOR_EMAIL>"

          for i in {1..5}; do
            git pull --rebase --autostash origin main

            if git push origin main; then
              echo "Changes pushed successfully"
              exit 0
            fi

            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "Push failed after 5 retries"
          exit 1