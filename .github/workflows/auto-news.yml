name: Auto News Bot

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch:       # Allows manual run from Actions tab

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Fetch and Update News
        run: npm start

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Derrick-MUGISHA"
          git config --global user.email "derrickmugisha169@gmail.com"
          
          # Fix: Add the specific files we actually change
          git add README.md data/news_log.md
          
          # Check if there are changes before committing to avoid errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Update news feed [skip ci]" && git push)