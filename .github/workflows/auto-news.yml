name: Auto News Bot

on:
  push:                   # Runs on code edits (for testing)
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 mins (for data)
  workflow_dispatch:      # Allows manual button click

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Fetch News (Dry Run or Real)
        run: npm start

      - name: Commit and Push Changes
        # PROFESSIONAL TOUCH: Only commit if this is a Scheduled run or Manual trigger.
        # This skips the commit step on standard code pushes.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "Derrick-MUGISHA"
          git config --global user.email "derrickmugisha169@gmail.com"
          
          git add README.md data/news_log.md
          
          # We don't need [skip ci] here because the schedule doesn't trigger 'push' events
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto news update [$(date -u)]" && git push)