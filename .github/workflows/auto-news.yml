name: Auto News Bot

on:
  schedule:
     - cron: '*/15 * * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Fetch and Update News
        run: npm start

      - name: Commit and Push Changes
        run: |
          # Configure git with --global flag
          git config --global user.name "Derrick-MUGISHA"
          git config --global user.email "derrickmugisha169@gmail.com"
          
          # Add the files that your script ACTUALLY creates
          git add README.md data/news_log.md
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto news update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi