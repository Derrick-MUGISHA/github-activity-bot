name: Enhanced Auto News Bot

concurrency:
  group: auto-news-bot
  cancel-in-progress: false

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Fetch, Update News & Sync WhatsApp
        run: npm start
        env:
          NODE_ENV: production
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_RECIPIENT_NUMBER: ${{ secrets.WHATSAPP_RECIPIENT_NUMBER }}

      - name: Generate Summary
        run: |
          echo "## Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "data/stats.json" ]; then
            TOTAL=$(jq -r '.total' data/stats.json)
            echo "- **Total Articles**: $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "- **Categories**: $(jq -r '.by_category | length' data/stats.json)" >> $GITHUB_STEP_SUMMARY
            echo "- **Sources**: $(jq -r '.by_source | length' data/stats.json)" >> $GITHUB_STEP_SUMMARY
            echo "- **Languages**: $(jq -r '.by_language | length' data/stats.json)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "News updated & WhatsApp synced!" >> $GITHUB_STEP_SUMMARY

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Derrick-MUGISHA"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Truncate news_log.md before staging — GitHub hard limit is 100 MB.
          # Keep the last 3000 lines (~3-5 MB) so recent history is preserved.
          if [ -f "data/news_log.md" ]; then
            FILE_SIZE=$(wc -c < "data/news_log.md")
            echo "news_log.md size: ${FILE_SIZE} bytes"
            if [ "$FILE_SIZE" -gt 10000000 ]; then
              echo "Truncating news_log.md to last 3000 lines..."
              tail -n 3000 data/news_log.md > data/news_log_tmp.md
              mv data/news_log_tmp.md data/news_log.md
              echo "Truncated. New size: $(wc -c < data/news_log.md) bytes"
            fi
          fi

          # Add all generated files
          git add README.md data/*.md data/*.json 2>/dev/null || true

          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Get stats for commit message
          TOTAL_ARTICLES=$(jq -r '.total // 0' data/stats.json 2>/dev/null || echo "0")
          CATEGORIES=$(jq -r '.by_category | length // 0' data/stats.json 2>/dev/null || echo "0")

          git commit -m "🤖 Auto update: $TOTAL_ARTICLES articles across $CATEGORIES categories | CAT: $(TZ='Africa/Kigali' date +'%Y-%m-%d %H:%M') | UTC: $(date -u +'%Y-%m-%d %H:%M')"

          for i in {1..5}; do
            git pull --rebase origin main

            if git push origin main; then
              echo "Changes pushed successfully"
              exit 0
            fi

            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "Push failed after 5 retries"
          exit 1